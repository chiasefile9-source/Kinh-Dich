<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kiểm Tra Từ Vựng Lớp 10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: một tờ bài kiểm tra kẻ ô, 10 câu xếp dọc, thanh nộp bài cố định ở đáy */
:root {
  --bg: #eef1f6;
  --paper: #fbfcfe;
  --ink: #1b2438;
  --muted: #5d6a85;
  --line: #cfd8e8;
  --grid: rgba(60, 90, 160, 0.07);
  --pen: #1d4ed8;
  --pen-soft: #e3ebff;
  --ok: #12805c;
  --ok-bg: #dcf5ea;
  --bad: #c4321f;
  --bad-bg: #fde6e2;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151f; --paper: #171e2c; --ink: #e6ebf5; --muted: #93a0ba; --line: #2c374d;
    --grid: rgba(140, 170, 255, 0.06); --pen: #8aaaff; --pen-soft: #22304f;
    --ok: #4fd3a0; --ok-bg: #123428; --bad: #ff8a78; --bad-bg: #3b1d1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151f; --paper: #171e2c; --ink: #e6ebf5; --muted: #93a0ba; --line: #2c374d;
  --grid: rgba(140, 170, 255, 0.06); --pen: #8aaaff; --pen-soft: #22304f;
  --ok: #4fd3a0; --ok-bg: #123428; --bad: #ff8a78; --bad-bg: #3b1d1a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 24px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

header h1 { font-size: clamp(1.6rem, 5vw, 2.1rem); line-height: 1.15; margin: 0 0 4px; font-weight: 700; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 0.95rem; }

.scope { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.scope .lbl { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
.chip span {
  display: inline-block; padding: 6px 14px; border: 1.5px solid var(--line); border-radius: 999px;
  font-size: 0.9rem; font-weight: 500; background: var(--paper); color: var(--muted);
}
.chip input:checked + span { background: var(--pen); border-color: var(--pen); color: var(--paper); }
.chip input:focus-visible + span { outline: 3px solid var(--pen); outline-offset: 2px; }

.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.part { padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--pen-soft); color: var(--pen);
  font-size: 0.8rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
ol.qs { list-style: none; margin: 0; padding: 0; }
.q { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: 12px; padding: 18px; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; }
.qnum { font-family: var(--font-mono); font-size: 1.15rem; color: var(--pen); padding-top: 1px; }
.qtext { margin: 0 0 10px; font-size: 1.02rem; }
.qtext b { font-weight: 700; }
.pos { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin: 0 2px; white-space: nowrap; }
.meta { margin-top: 6px; font-size: 0.8rem; color: var(--muted); font-family: var(--font-mono); }

input.ans, textarea.ans {
  width: 100%; font: inherit; font-size: 1.05rem; color: var(--pen); background: transparent;
  border: 0; border-bottom: 2px solid var(--line); border-radius: 0; padding: 6px 2px; outline: none; resize: none;
}
input.ans:focus, textarea.ans:focus { border-bottom-color: var(--pen); }
input.ans::placeholder, textarea.ans::placeholder { color: var(--muted); opacity: 0.55; }
.ans:disabled { color: var(--ink); opacity: 1; -webkit-text-fill-color: currentColor; }

.words { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.word {
  font: inherit; font-size: 0.98rem; background: var(--paper); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer;
}
.word:hover:not(:disabled) { border-color: var(--pen); }
.word:focus-visible, .btn:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
.word.used { opacity: 0.35; }
.word:disabled { cursor: default; }
.tools { display: flex; gap: 12px; margin-top: 8px; }
.link { background: none; border: 0; padding: 4px 0; font: inherit; font-size: 0.85rem; color: var(--pen); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link:disabled { display: none; }

.fb { margin-top: 10px; padding: 8px 12px; border-radius: 6px; font-size: 0.93rem; }
.q.ok .fb { background: var(--ok-bg); color: var(--ok); }
.q.bad .fb { background: var(--bad-bg); color: var(--bad); }
.q.ok .qnum::after { content: " ✓"; color: var(--ok); }
.q.bad .qnum::after { content: " ✗"; color: var(--bad); }
.fb b { font-weight: 700; }

.result { padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.result .score { font-family: var(--font-mono); font-size: 2.2rem; color: var(--pen); line-height: 1; }
.result .msg { font-size: 1rem; }
.result .best { width: 100%; color: var(--muted); font-size: 0.85rem; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--paper); border-top: 1px solid var(--line);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.prog { flex: 1; min-width: 0; }
.prog .t { font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
.track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--pen); transition: width 0.2s; }
.btn { font: inherit; font-weight: 700; font-size: 0.98rem; padding: 11px 22px; border-radius: 8px; border: 2px solid var(--pen); background: var(--pen); color: var(--paper); cursor: pointer; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--pen); }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
@media (max-width: 440px) { .q { grid-template-columns: 1.8rem minmax(0, 1fr); gap: 8px; padding: 16px 14px; } .btn { padding: 11px 16px; } }
</style>

<div class="wrap">
  <header>
    <h1>Kiểm Tra Từ Vựng Lớp 10</h1>
    <p>8 câu từ vựng và 2 câu sắp xếp lại từ. Mỗi lần làm là một đề mới.</p>
  </header>

  <div class="scope" id="scope">
    <span class="lbl">Phạm vi</span>
    <label class="chip"><input type="checkbox" id="u1" value="1" checked><span>Unit 1</span></label>
    <label class="chip"><input type="checkbox" id="u2" value="2" checked><span>Unit 2</span></label>
    <label class="chip"><input type="checkbox" id="u3" value="3" checked><span>Unit 3</span></label>
  </div>

  <div class="result" id="result" hidden>
    <div class="score" id="score"></div>
    <div class="msg" id="msg"></div>
    <div class="best" id="best"></div>
  </div>

  <div class="sheet">
    <div class="part">Phần A · Từ vựng (câu 1–8)</div>
    <ol class="qs" id="partA"></ol>
    <div class="part" style="border-top:1px solid var(--line)">Phần B · Sắp xếp lại từ (câu 9–10)</div>
    <ol class="qs" id="partB"></ol>
  </div>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="prog">
      <div class="t" id="progText">Đã làm 0/10</div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <button class="btn" id="mainBtn" type="button">Nộp bài</button>
  </div>
</div>

<script>
// en | vi | loại từ | unit | đáp án khác (ngăn bằng /)
var RAW = [
"divide|phân chia|v|1","division|sự phân chia|n|1","homemaker|người nội trợ|n|1","breadwinner|trụ cột gia đình|n|1",
"equal|bình đẳng|adj|1","unequal|không bình đẳng|adj|1","equality|sự bình đẳng|n|1","grocery|hàng thực phẩm|n|1",
"lift|nhấc lên|v|1","laundry|quần áo cần giặt|n|1","rubbish|rác|n|1|trash","crane|cần cẩu|n|1","crash|va chạm|v|1",
"create|tạo ra|v|1","creative|sáng tạo|adj|1","creativity|tính sáng tạo|n|1","special|đặc biệt|adj|1",
"benefit|lợi ích|n|1","beneficial|có lợi|adj|1","responsibility|trách nhiệm|n|1","responsible|có trách nhiệm|adj|1",
"irresponsible|vô trách nhiệm|adj|1","gratitude|lòng biết ơn|n|1","appreciate|trân trọng|v|1","bond|mối liên kết|n|1",
"celebrate|ăn mừng|v|1","routine|thói quen hằng ngày|n|1","achieve|đạt được|v|1","achievement|thành tựu|n|1",
"character|tính cách|n|1","encourage|khuyến khích|v|1","discourage|làm nản lòng|v|1","duty|bổn phận|n|1",
"common|thông thường|adj|1","connection|sự kết nối|n|1","quality|chất lượng|n|1","develop|phát triển|v|1",
"damage|gây thiệt hại|v|1","necessary|cần thiết|adj|1","basic|cơ bản|adj|1","adult|người trưởng thành|n|1",
"project|dự án|n|1","experience|kinh nghiệm|n|1","similar|tương tự|adj|1","exchange|sự trao đổi|n|1",
"express|bày tỏ|v|1","teenager|thiếu niên|n|1","suppose|giả sử|v|1","doubt|sự nghi ngờ|n|1","value|giá trị|n|1",
"prepare|chuẩn bị|v|1","truth|sự thật|n|1","honest|trung thực|adj|1","respect|sự tôn trọng|n|1",
"wealth|sự giàu có|n|1","wealthy|giàu có|adj|1","table manners|phép tắc trên bàn ăn|n|1|table manner","untidy|bừa bộn|adj|1",
"bread pudding|bánh pudding làm từ bánh mì|n|1",
"tidy|gọn gàng|adj|2","pronounce|phát âm|v|2","isolation|sự cô lập|n|2","specific|cụ thể|adj|2",
"establish|thành lập|v|2|set up","adopt|nhận nuôi|v|2","awareness|sự nhận thức|n|2","carbon footprint|dấu chân cacbon|n|2",
"reservation|sự đặt chỗ trước|n|2","decision|sự quyết định|n|2","sustainable|bền vững|adj|2","sustainability|sự bền vững|n|2",
"explosion|vụ nổ|n|2","explode|nổ|v|2","household appliance|đồ điện gia dụng|n|2","cut down on|giảm bớt|phr|2|reduce",
"refill|làm đầy|v|2","raw material|vật liệu thô|n|2","sort|phân loại|v|2","electricity|điện|n|2",
"electrician|thợ điện|n|2","pollute|làm ô nhiễm|v|2|contaminate","pollution|sự ô nhiễm|n|2|contamination",
"shade|bóng mát|n|2","announcement|thông báo|n|2","donate|hiến tặng|v|2","expect|mong đợi|v|2",
"expectation|sự mong đợi|n|2","safe|an toàn|adj|2","safety|sự an toàn|n|2","make a difference|tạo ra sự khác biệt|phr|2",
"search for|tìm kiếm|phr|2","emission|sự phát ra|n|2","estimate|ước tính|v|2","impact|tác động|n|2|effect","pride|sự tự hào|n|2",
"popular|nổi tiếng|adj|3","popularity|sự nổi tiếng|n|3","talent|tài năng|n|3","talented|có tài năng|adj|3",
"instrument|nhạc cụ|n|3","award|giải thưởng|n|3","upload|tải lên mạng|v|3","download|tải xuống|v|3",
"perform|biểu diễn|v|3","performance|buổi biểu diễn|n|3","performer|người biểu diễn|n|3","judge|giám khảo|n|3",
"audience|khán giả|n|3","compete|thi đấu|v|3","competition|cuộc thi|n|3|contest","competitor|đối thủ|n|3",
"hesitate|do dự|v|3","hesitation|sự do dự|n|3","ordinary|bình thường|adj|3","extraordinary|phi thường|adj|3",
"identify|nhận dạng|v|3","identity|danh tính|n|3","contestant|thí sinh|n|3","thunder|tiếng sấm|n|3",
"blend|trộn lẫn|v|3","semi-final|trận bán kết|n|3","eliminate|loại bỏ|v|3","argue|tranh luận|v|3",
"argument|sự tranh luận|n|3","dress up|ăn diện|phr|3","prefer|thích hơn|v|3","preference|sự thích hơn|n|3",
"runner-up|á quân|n|3","cash prize|giải thưởng tiền mặt|n|3","take place|diễn ra|phr|3","decorate|trang trí|v|3",
"decoration|đồ trang trí|n|3","exhibit|triển lãm|v|3","exhibition|cuộc triển lãm|n|3","trumpet|kèn trumpet|n|3"
];
var BANK = RAW.map(function (s) {
  var p = s.split("|");
  return { en: p[0], vi: p[1], pos: p[2], unit: +p[3], alt: p[4] ? p[4].split("/") : [] };
});

var SENT = [
  { t: "My mother is a homemaker and my father is the breadwinner.", u: 1 },
  { t: "Men and women should have equal rights at home.", u: 1 },
  { t: "Sharing household chores helps strengthen family bonds.", u: 1 },
  { t: "I am grateful to my parents for their support.", u: 1 },
  { t: "Children should take responsibility for their own rooms.", u: 1 },
  { t: "We need to reduce our carbon footprint.", u: 2 },
  { t: "Many people are aware of the impact of pollution.", u: 2 },
  { t: "We should cut down on plastic to protect the environment.", u: 2 },
  { t: "He decided to donate some money to the charity.", u: 2 },
  { t: "Living a sustainable lifestyle can make a difference.", u: 2 },
  { t: "The exhibition will take place in the city museum.", u: 3 },
  { t: "She was the runner-up in the singing contest.", u: 3 },
  { t: "Teenagers prefer listening to music on their phones.", u: 3 },
  { t: "The judges were impressed by her extraordinary talent.", u: 3 },
  { t: "They are going to decorate the house for the party.", u: 3 }
];

var POS = { n: "danh từ", v: "động từ", adj: "tính từ", phr: "cụm từ" };
var $ = function (id) { return document.getElementById(id); };
var quiz = [], submitted = false;

function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function units() {
  var u = [];
  [1, 2, 3].forEach(function (n) { if ($("u" + n).checked) u.push(n); });
  return u.length ? u : [1, 2, 3];
}
function normWord(s) {
  return s.toLowerCase().replace(/[.,!?;:]/g, " ").replace(/-/g, " ").replace(/\s+/g, " ").trim()
    .replace(/^(to|a|an|the) /, "");
}
function normSent(s) {
  return s.toLowerCase().replace(/[.,!?;:"“”]/g, "").replace(/-/g, " ").replace(/\s+/g, " ").trim();
}
function hint(w) {
  var parts = w.split(/[ -]/);
  var letters = parts.map(function (x) { return x.length; });
  if (parts.length === 1) return letters[0] + " chữ cái";
  return parts.length + " từ · " + letters.join(" + ") + " chữ cái";
}

function newQuiz() {
  submitted = false;
  var us = units();
  var vocab = shuffle(BANK.filter(function (b) { return us.indexOf(b.unit) > -1; })).slice(0, 8);
  var sents = shuffle(SENT.filter(function (s) { return us.indexOf(s.u) > -1; }));
  if (sents.length < 2) sents = shuffle(SENT);
  sents = sents.slice(0, 2);
  quiz = vocab.map(function (v) { return { type: "vocab", d: v }; })
    .concat(sents.map(function (s) {
      var words = s.t.replace(/[.]$/, "").split(" ").map(function (w, i) { return i === 0 && w !== "I" ? w.toLowerCase() : w; });
      var sh = words, tries = 0;
      do { sh = shuffle(words); tries++; } while (sh.join(" ") === words.join(" ") && tries < 10);
      return { type: "sent", d: s, words: sh };
    }));
  render();
}

function render() {
  $("result").hidden = true;
  var a = "", b = "";
  quiz.forEach(function (q, i) {
    var n = i + 1, h;
    if (q.type === "vocab") {
      h = '<li class="q" id="q' + n + '"><div class="qnum">' + n + '</div><div>' +
        '<p class="qtext">“<b>' + q.d.vi + '</b>” <span class="pos">' + POS[q.d.pos] + '</span> trong tiếng Anh là (…)</p>' +
        '<input class="ans" id="a' + n + '" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Nhập đáp án">' +
        '<div class="meta">' + hint(q.d.en) + '</div><div class="fb" hidden></div></div></li>';
      a += h;
    } else {
      h = '<li class="q" id="q' + n + '"><div class="qnum">' + n + '</div><div>' +
        '<p class="qtext">Sắp xếp các từ sau thành câu hoàn chỉnh:</p>' +
        '<div class="words" id="w' + n + '">' + q.words.map(function (w, k) {
          return '<button type="button" class="word" data-k="' + k + '">' + w + '</button>';
        }).join("") + '</div>' +
        '<textarea class="ans" id="a' + n + '" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nhập hoặc chạm vào từng từ để ghép câu"></textarea>' +
        '<div class="tools"><button type="button" class="link" data-clear="' + n + '">Xóa câu</button></div>' +
        '<div class="fb" hidden></div></div></li>';
      b += h;
    }
  });
  $("partA").innerHTML = a;
  $("partB").innerHTML = b;
  $("mainBtn").textContent = "Nộp bài";
  $("mainBtn").className = "btn";
  bind();
  progress();
  window.scrollTo(0, 0);
}

function bind() {
  quiz.forEach(function (q, i) {
    var n = i + 1, el = $("a" + n);
    el.addEventListener("input", function () { progress(); if (q.type === "sent") markUsed(n); });
    if (q.type === "vocab") {
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); var nx = $("a" + (n + 1)); if (nx) nx.focus(); }
      });
    }
  });
  Array.prototype.forEach.call(document.querySelectorAll(".word"), function (btn) {
    btn.addEventListener("click", function () {
      var box = btn.parentNode, n = box.id.slice(1), ta = $("a" + n);
      ta.value = (ta.value.trim() + " " + btn.textContent).trim() + " ";
      ta.dispatchEvent(new Event("input"));
      ta.focus();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-clear]"), function (btn) {
    btn.addEventListener("click", function () {
      var ta = $("a" + btn.getAttribute("data-clear")); ta.value = ""; ta.dispatchEvent(new Event("input")); ta.focus();
    });
  });
}

function markUsed(n) {
  var have = normSent($("a" + n).value).split(" ").filter(Boolean);
  Array.prototype.forEach.call($("w" + n).children, function (btn) {
    var w = normSent(btn.textContent), idx = have.indexOf(w);
    if (idx > -1) { have.splice(idx, 1); btn.classList.add("used"); } else { btn.classList.remove("used"); }
  });
}

function progress() {
  var done = 0;
  quiz.forEach(function (q, i) { if ($("a" + (i + 1)).value.trim()) done++; });
  $("progText").textContent = submitted ? "Đã chấm xong" : "Đã làm " + done + "/10";
  $("fill").style.width = (submitted ? 100 : done * 10) + "%";
}

function submit() {
  submitted = true;
  var score = 0;
  quiz.forEach(function (q, i) {
    var n = i + 1, el = $("a" + n), li = $("q" + n), fb = li.querySelector(".fb"), ok = false, correct;
    if (q.type === "vocab") {
      var user = normWord(el.value);
      var accepted = [q.d.en].concat(q.d.alt).map(normWord);
      ok = user !== "" && accepted.indexOf(user) > -1;
      correct = q.d.en;
    } else {
      ok = normSent(el.value) === normSent(q.d.t);
      correct = q.d.t;
    }
    if (ok) score++;
    li.classList.add(ok ? "ok" : "bad");
    fb.hidden = false;
    fb.innerHTML = ok ? "Chính xác." : "Đáp án đúng: <b>" + correct + "</b>";
    el.disabled = true;
  });
  Array.prototype.forEach.call(document.querySelectorAll(".word,[data-clear]"), function (b) { b.disabled = true; });
  var msg = score >= 9 ? "Xuất sắc!" : score >= 7 ? "Khá tốt, ôn thêm vài từ nữa là chắc." : score >= 5 ? "Cần ôn thêm, xem lại các câu sai bên dưới." : "Ôn lại từ vựng rồi thử đề mới nhé.";
  var best = score;
  try {
    var old = parseInt(localStorage.getItem("vocab10-best"), 10);
    if (!isNaN(old) && old > best) best = old;
    localStorage.setItem("vocab10-best", String(best));
  } catch (e) {}
  $("score").textContent = score + "/10";
  $("msg").textContent = msg;
  $("best").textContent = "Điểm cao nhất trên thiết bị này: " + best + "/10";
  $("result").hidden = false;
  $("mainBtn").textContent = "Làm đề mới";
  $("mainBtn").className = "btn ghost";
  progress();
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

$("mainBtn").addEventListener("click", function () { submitted ? newQuiz() : submit(); });
["u1", "u2", "u3"].forEach(function (id) { $(id).addEventListener("change", newQuiz); });
newQuiz();
</script>
